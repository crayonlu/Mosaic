name: Build Docker Image

on:
  pull_request:
    branches:
      - main
    paths:
      - 'server/**'
      - 'server-go/**'
      - 'packages/**'
      - '.github/workflows/**'

  push:
    tags:
      - 'v*'
      - 'server-v*'

  workflow_dispatch:
    inputs:
      server:
        description: 'Which implementation to build (go is the cutover target)'
        required: true
        default: 'go'
        type: choice
        options:
          - 'go'
          - 'rust'
      tag:
        description: 'Docker image tag (e.g., v1.0.0, latest)'
        required: true
        default: 'latest'
      push:
        description: 'Push image to registry'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The Go server is the cutover target, so it is the default. The Rust
      # image stays buildable by choosing it explicitly, which is also the
      # rollback path.
      - name: Resolve the Dockerfile
        id: target
        run: |
          if [ "${{ inputs.server }}" = "rust" ]; then
            echo "file=./server/Dockerfile" >> "$GITHUB_OUTPUT"
          else
            echo "file=./server-go/Dockerfile" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.push == 'true' || startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/mosaic-server
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/server-v') }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.target.outputs.file }}
          push: ${{ inputs.push == 'true' || startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            RUST_BUILD_MODE=release
            GOPROXY=https://proxy.golang.org,direct
